<!doctype html>
<html lang="en" data-theme="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Before the first paint, so the page opens in the person's own
			// theme and language: both are in cookies of this browser.
			(function () {
				var root = document.documentElement;
				var theme = /(?:^|; )theme=(light|dark)/.exec(document.cookie);
				if (theme) root.dataset.theme = theme[1];
				var said = /[?&]lang=([a-z]{2})(?:&|$)/.exec(location.search);
				var lang = said || /(?:^|; )lang=([a-z]{2})(?:;|$)/.exec(document.cookie);
				if (lang) root.lang = { pt: 'pt-BR', zh: 'zh-CN' }[lang[1]] || lang[1];
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
