<!doctype html>
<html lang="en" data-theme="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Before the first paint, so nothing flashes: the page is only
			// files, and what a person chose is in two cookies of this browser.
			(function () {
				var root = document.documentElement;
				var theme = /(?:^|; )theme=(light|dark)/.exec(document.cookie);
				if (theme) root.dataset.theme = theme[1];
				var lang = /(?:^|; )lang=([a-z]{2})(?:;|$)/.exec(document.cookie);
				if (lang) root.lang = lang[1];
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
