# One workspace, crates cut by dependency, not by platform (CLAUDE.md, Layout).
# A plugin's folder under plugins/ holds its two crates (DECISIONS 100, 101):
# `client/`, its client half, and `world/`, its world half.
[workspace]
resolver = "3"
members = ["crates/*", "plugins/*/client", "plugins/*/world"]

[workspace.package]
version = "0.0.0" # the released version is the git tag (release.config.js)
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/sulram/planet"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
topology = { path = "crates/topology" }
worldgen = { path = "crates/worldgen" }
scene = { path = "crates/scene" }
avatar = { path = "crates/avatar" }
client = { path = "crates/client" }
module = { path = "crates/module" }
render = { path = "crates/render" }
protocol = { path = "crates/protocol" }
voxel = { path = "crates/voxel" }
seat = { path = "crates/seat" }
world = { path = "crates/world" }
plugins-client = { path = "crates/plugins-client" }
plugins-world = { path = "crates/plugins-world" }
ui-native = { path = "crates/ui-native" }

# Pins shared with vybe (CLAUDE.md, Toolchain pins).
wgpu = "30"
winit = "0.30"

bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
libm = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
prost = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The generator runs every frame while streaming: keep dev builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
