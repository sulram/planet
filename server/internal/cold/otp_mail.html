<!doctype html>
<html lang="{{.Words.Lang}}">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>{{.Words.Subject}}</title>
	</head>
	<body style="margin:0;padding:0;background:#f0f0f0;color:#000000;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0f0f0;">
			<tr>
				<td align="center" style="padding:32px 16px;">
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
						<tr>
							<td style="padding:0 0 12px;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#000000;">{{.AppName}}</td>
						</tr>
						<tr>
							<td style="background:#ffffff;border:1px solid #000000;padding:28px 24px;">
								<p style="margin:0 0 12px;font-size:14px;line-height:1.6;">{{.Words.Greeting}}</p>
								<p style="margin:0 0 20px;font-size:14px;line-height:1.6;">{{.Words.Intro}}</p>
								<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
									<tr>
										<td align="center" style="background:#000000;">
											<a href="{{.Link}}" style="display:block;padding:14px 16px;font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#ffffff;text-decoration:none;">{{.Words.Button}}</a>
										</td>
									</tr>
								</table>
								<p style="margin:24px 0 8px;font-size:12px;line-height:1.6;color:#666666;">{{.Words.CodeIntro}}</p>
								<p style="margin:0 0 20px;font-size:36px;font-weight:700;letter-spacing:0.2em;line-height:1.2;color:#000000;">{{.Code}}</p>
								<p style="margin:0;font-size:12px;line-height:1.6;color:#666666;">{{.Words.Expiry}}</p>
							</td>
						</tr>
						<tr>
							<td style="padding:16px 0 0;font-size:12px;color:#666666;">{{.AppName}}</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
