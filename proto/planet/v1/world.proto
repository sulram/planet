// The wire between a client and a world server. One message per WebSocket
// binary frame: a ClientMessage one way, a ServerMessage the other.
//
// The schema is the single source for Rust (crates/protocol) and Go
// (server/internal/protocol); `bun run proto` regenerates both. A change here
// that an older client cannot read bumps PROTOCOL in both, and Hello says
// which one a client speaks.
syntax = "proto3";

package planet.v1;

option go_package = "github.com/sulram/planet/server/internal/protocol;protocol";

// The body a stance is measured from. Every body is parametrised on the
// planet's sector grid: on the moon the column is the one its radial passes
// through, as the place code does it.
enum Body {
  BODY_PLANET = 0;
  BODY_MOON = 1;
}

// How a body moves right now. One clip each, on every client.
enum Gait {
  GAIT_IDLE = 0;
  GAIT_WALK = 1;
  GAIT_RUN = 2;
  GAIT_JUMP = 3;
  GAIT_FALL = 4;
  GAIT_FLY = 5;
  GAIT_SWIM = 6;
}

// Where a body is and how it moves: what presence carries, many times a
// second. A pose is what a link carries; a stance is what a peer sends.
// The place is an address with fractional blocks, never a float position.
message Stance {
  Body body = 1;
  // 0 to 5.
  uint32 sector = 2;
  // Blocks along the sector's axes. A float holds a sector side of 2^16 to
  // 1/256 of a block, which is 2 mm.
  float u = 3;
  float v = 4;
  // Feet over the datum sphere of the body.
  float height_m = 5;
  // Unit vector in world space, the way the body faces.
  float facing_x = 6;
  float facing_y = 7;
  float facing_z = 8;
  Gait gait = 9;
  // What the clip is played at: along the ground on foot, through the water
  // when swimming.
  float speed_mps = 10;
  // Running on foot, flying flat out.
  bool sprint = 11;
}

// What a client says first. Who it is was settled before: the key it was
// given on entering rides the socket URL, and no key is a visitor.
message Hello {
  // The protocol this client speaks. Refused when it is not the server's.
  uint32 protocol = 1;
  // The avatar worn, as an asset reference: a path under the asset root, or
  // a URL. A person's own avatar loads through the same reference.
  string avatar = 2;
  // What to be called, at most `NameChars`. An account's name, as mundos
  // signed it, wins over it; a visitor is called this or nothing.
  string name = 3;
}

// The avatar changed.
message Wear {
  string avatar = 1;
}

// The name changed. Empty is a name too: back to nobody in particular.
message Rename {
  string name = 1;
}

// Who hears a line.
enum Scope {
  // Everyone within `NearBlocks` of the speaker, on the same body.
  SCOPE_NEAR = 0;
  // Everyone in the world, on every body.
  SCOPE_WORLD = 1;
}

// A line of chat. Relayed to everyone in scope, the speaker included, and
// never stored. Dropped, and nobody told, past the actor's length and rate
// limits: a UI holds the same limits so a person never meets them.
message Say {
  Scope scope = 1;
  // At most 500 characters. May be empty when `here` is set.
  string text = 2;
  // Share where you stand: the server fills Said.stance from the stance it
  // holds, so a client cannot claim to stand where it does not.
  bool here = 3;
}

message ClientMessage {
  oneof message {
    Hello hello = 1;
    Stance stance = 2;
    Wear wear = 3;
    Say say = 4;
    Rename rename = 5;
  }
}

// Seed + params + generator version, as the world folder holds it. The
// params are the JSON the generator version owns.
message Recipe {
  // A u64 as 16 lowercase hex digits.
  string seed = 1;
  uint32 generator_version = 2;
  string params_json = 3;
}

// Someone in the world.
message Peer {
  // Given by the world actor, unique while the world is active.
  uint32 session = 1;
  // As the person set it. Empty when they set none.
  string name = 2;
  // Signed out. Looks, never builds.
  bool visitor = 3;
  string avatar = 4;
  // Absent until the peer has said where it is.
  Stance stance = 5;
}

// What a session may do, as mundos says it for one entry. The order is the
// order of trust: a builder builds, an admin builds and founds the world.
enum Level {
  LEVEL_ANONYMOUS = 0;
  LEVEL_SIGNED_IN = 1;
  LEVEL_BUILDER = 2;
  LEVEL_ADMIN = 3;
}

// The answer to Hello: who you are here, what world this is, who is here.
message Welcome {
  uint32 session = 1;
  Recipe recipe = 2;
  repeated Peer peers = 3;
  // What this session may do, for its life. A client offers its tools by it.
  Level level = 4;
}

message Joined {
  Peer peer = 1;
}

message Left {
  uint32 session = 1;
}

message Wearing {
  uint32 session = 1;
  string avatar = 2;
}

message Renamed {
  uint32 session = 1;
  string name = 2;
}

message Moved {
  uint32 session = 1;
  Stance stance = 2;
}

// Every stance that changed since the last tick, yours included: ignore your
// own session. Sent on every tick that has something to say, and every few
// seconds regardless, so a silent link is a dead one.
message Stances {
  repeated Moved moved = 1;
}

// A line someone said, the receiver's own included.
message Said {
  uint32 session = 1;
  Scope scope = 2;
  string text = 3;
  // Where the speaker stood, when they shared it. Absent otherwise.
  Stance stance = 4;
}

// Sent instead of Welcome, then the socket closes.
message Refused {
  string reason = 1;
}

message ServerMessage {
  oneof message {
    Welcome welcome = 1;
    Joined joined = 2;
    Left left = 3;
    Stances stances = 4;
    Wearing wearing = 5;
    Refused refused = 6;
    Said said = 7;
    Renamed renamed = 8;
  }
}
