[package]
name = "ui-native"
description = "The native settings panel: egui over the command/event seam. All of egui lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
client.workspace = true
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true
# Same pins as vybe. egui is pure math and egui-winit matches our winit; the
# painter is ours (paint.rs), because egui-wgpu pins wgpu 29 and we ride 30.
egui = { version = "0.35", default-features = false, features = ["bytemuck", "default_fonts"] }
egui-winit = { version = "0.35", default-features = false }

[lints]
workspace = true
