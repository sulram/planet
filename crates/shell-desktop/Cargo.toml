[package]
name = "shell-desktop"
description = "Platform shell for desktop and Raspberry Pi: a winit window, or no window at all."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "planet"
path = "src/main.rs"

[dependencies]
client.workspace = true
render.workspace = true
ui-native.workspace = true
worldgen.workspace = true
winit.workspace = true
log.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
pollster = "0.4"

[lints]
workspace = true
